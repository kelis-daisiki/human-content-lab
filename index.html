const QUESTION_COUNT = 10;
const QUESTION_BY_ID = new Map(
  [...Object.values(COMMON_QUESTIONS).flat(), ...Object.values(BUDDY_QUESTIONS).flat(),
    ...LEISURE_QUESTIONS, ...CLOSING_QUESTIONS].map(question => [question.id, question])
);

function shuffle(items, random) {
  const shuffled = [...items];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function drawQuestions(buddyId, random = Math.random) {
  const buddyQuestions = BUDDY_QUESTIONS[buddyId] ?? BUDDY_QUESTIONS.deepseek;
  const [first, ...otherBuddyQuestions] = shuffle(buddyQuestions, random).slice(0, 3);
  const common = Object.values(COMMON_QUESTIONS).map(group => shuffle(group, random)[0]);
  return [first, ...shuffle([...common, ...otherBuddyQuestions], random),
    shuffle(LEISURE_QUESTIONS, random)[0], ...CLOSING_QUESTIONS];
}

function restoreQuestions(ids, buddyId) {
  if (!Array.isArray(ids) || ids.length !== QUESTION_COUNT || new Set(ids).size !== QUESTION_COUNT) return null;
  const questions = ids.map(id => QUESTION_BY_ID.get(id));
  if (questions.some(q => !q)) return null;
  const scored = questions.slice(0, 7);
  const buddyQuestions = BUDDY_QUESTIONS[buddyId];
  if (!buddyQuestions?.includes(scored[0]) || scored.filter(q => buddyQuestions.includes(q)).length !== 3) return null;
  if (!Object.values(COMMON_QUESTIONS).every(group => scored.filter(q => group.includes(q)).length === 1)) return null;
  if (!LEISURE_QUESTIONS.includes(questions[7]) || questions[8] !== CLOSING_QUESTIONS[0] || questions[9] !== CLOSING_QUESTIONS[1]) return null;
  return questions;
}

function isValidAnswers(answers, questions, complete = true) {
  if (!Array.isArray(questions) || questions.length !== QUESTION_COUNT ||
      !Array.isArray(answers) || answers.length !== QUESTION_COUNT) return false;
  return questions.every((q, i) => {
    const answer = answers[i];
    return answer === null ? !complete : Number.isInteger(answer) && answer >= 0 && answer < q.options.length;
  });
}

let scanTimer;
let toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<span aria-hidden="true">↗</span>';
function persist(){try{sessionStorage.setItem(KEY,JSON.stringify(state));}catch{/* 答题不依赖存储权限。 */}}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);}
function focusTitle(){const title=app.querySelector('h1');if(title){title.tabIndex=-1;title.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}

function home() {
  const buddy = AI_BUDDIES[state.buddy];
  app.innerHTML = `<section class="home fade-in">
    <div class="home-grid">
      <div>
        <h1>AI率测腻了？<br>查查你的<span class="highlight">含人量</span></h1>
        <p class="home-lead">先选个搭子。它会从自己的糗事里抽三道题。</p>
        <div class="hero-actions">
          <div class="buddy-picks" aria-label="选择出题搭子">
            ${Object.entries(AI_BUDDIES).map(([id, item]) => `<button class="buddy-pick ${state.buddy === id ? 'active' : ''}" data-buddy="${id}" aria-pressed="${state.buddy === id}" aria-label="${item.nick}">
              <span aria-hidden="true">${buddySVG(id)}</span><strong>${item.nick}</strong>
            </button>`).join('')}
          </div>
          <button class="button primary start" id="start">让${buddy.nick}出题 ${arrow}</button>
          <p class="micro">每局 10 题 · 约 3 分钟</p>
        </div>
      </div>
      <div class="stage" aria-label="当前出题搭子">
        <div class="stage-back" style="background-color:${buddy.color}"></div>
        <div class="squad-hero">${buddyFigure(state.buddy)}</div>
        <div class="bubble top">${buddy.line}</div>
      </div>
    </div>
  </section>`;
  app.querySelectorAll('[data-buddy]').forEach(button => button.addEventListener('click', () => {
    state = blank(button.dataset.buddy);
    questions = [];
    persist();
    home();
    app.querySelector(`[data-buddy="${state.buddy}"]`).focus({preventScroll: true});
  }));
  app.querySelector('#start').addEventListener('click', () => {
    state = blank(state.buddy);
    questions = drawQuestions(state.buddy);
    state.questionIds = questions.map(q => q.id);
    state.screen = 'quiz';
    persist();
    render();
    focusTitle();
  });
}

function quiz(){
  const q=questions[state.index];
  app.innerHTML=`<section class="question-layout fade-in"><div class="question-top"><button class="back" id="back"><span aria-hidden="true">←</span> ${state.index?'上一题':'返回首页'}</button><span class="progress-count"><strong>${String(state.index+1).padStart(2,'0')}</strong> / ${String(QUESTION_COUNT).padStart(2,'0')}</span></div><div class="progress" role="progressbar" aria-label="答题进度" aria-valuenow="${state.index+1}" aria-valuemin="0" aria-valuemax="${QUESTION_COUNT}"><span style="width:${(state.index+1)/QUESTION_COUNT*100}%"></span></div><div class="question-label"><span class="eyebrow">${String(state.index+1).padStart(2,'0')} / ${esc(q.tag)}</span>${q.tag.endsWith('出题') ? `<div class="question-mini" aria-hidden="true">${buddyFigure(state.buddy)}</div>` : ''}</div><h1>${esc(q.title)}</h1><p class="question-sub" id="question-sub" ${q.sub ? '' : 'hidden'}>${esc(q.sub)}</p><fieldset class="choices" aria-describedby="question-sub"><legend>${esc(q.title)}</legend>${q.options.map((o,i)=>`<label class="choice ${state.answers[state.index]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="choice-letter" aria-hidden="true">${'ABCD'[i]}</span><span class="choice-text">${esc(o.text)}</span></label>`).join('')}</fieldset><div class="feedback" id="feedback" aria-live="polite">${state.answers[state.index]!==null?esc(q.options[state.answers[state.index]].note):''}</div><div class="question-action"><button class="button primary" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===QUESTION_COUNT-1?'看看我是啥':'下一题'} ${arrow}</button></div></section>`;
  app.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{
    const value=Number(input.value);state.answers[state.index]=value;state.reportId=null;state.revealed=false;persist();
    app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c.contains(input)));
    document.querySelector('#feedback').textContent=q.options[value].note;document.querySelector('#next').disabled=false;
  }));
  document.querySelector('#back').addEventListener('click',()=>{if(state.index)state.index--;else state.screen='home';persist();render();focusTitle();});
  document.querySelector('#next').addEventListener('click',()=>{
    if(state.answers[state.index]===null)return;
    if(state.index<QUESTION_COUNT-1){state.index++;persist();render();focusTitle();}else if(isValidAnswers(state.answers, questions)){startScan();}
  });
}

function startScan(){
  clearTimeout(scanTimer);app.innerHTML=`<section class="scan fade-in">${buddyFigure(state.buddy,'scan-buddy')}<h1>搭子在写报告</h1><div class="scan-line" role="status" aria-live="polite">翻一下答题记录……</div></section>`;window.scrollTo({top:0,behavior:'instant'});
  const lines=['有一题想再确认一下……','图片画好了。'];let i=0;
  const step=()=>{if(i<lines.length){app.querySelector('.scan-line').textContent=lines[i++];scanTimer=setTimeout(step,650);}else{state.screen='report';state.reportId=crypto.randomUUID?crypto.randomUUID().slice(0,8).toUpperCase():Date.now().toString(36).toUpperCase();persist();render();focusTitle();}};
  scanTimer=setTimeout(step,500);
}

function reportPage(){
 const report=makeReport(state.answers, questions),p=report.profile,c=CHARACTERS[p.code];
 const buddyAnswer = questions[0].options[state.answers[0]];
 app.innerHTML=`<section class="result-layout fade-in"><div class="result-intro"><div><h1>查明了，你属于——</h1><span class="eyebrow">HUMAN CONTENT REPORT / ${esc(state.reportId||'LOCAL')}</span></div><span class="pill">今日成分</span></div><div class="result-grid"><article class="ticket" aria-label="你的检测报告" style="--type-color:${c.color}"><div class="ticket-head"><span>你的含人量类型</span><span>HCL / 今日归档</span></div><div class="type-poster"><div class="short-code">${c.short}</div>${characterSVG(c.kind,c.name+'原创结果角色')}<div class="poster-sticker">人类样本<br>已归档 ✓</div><h2>${c.name}</h2><p class="type-quote">${c.quote}</p><div class="type-tags">${c.tags.map(t=>`<span>#${t}</span>`).join('')}</div></div><div class="score-strip"><span>本次含人量<br><small>碳基出勤指数</small></span><strong>${report.score}<small> /100</small></strong></div><div class="ticket-tail"><span>含人量检测站<br>${AI_BUDDIES[state.buddy].nick}协助出具</span><span class="barcode" aria-hidden="true"></span></div></article><div class="result-copy"><span class="eyebrow">本所批注</span><h2>${esc(p.verdict)}</h2><p class="result-description">${esc(p.description)}</p><div class="diagnosis"><h3>本次主要症状</h3><p>${esc(symptom(p.code))}</p></div><div class="buddy-report">${buddyFigure(state.buddy)}<div><small>出题搭子的评语</small><strong>${AI_BUDDIES[state.buddy].nick}</strong><p>${esc(buddyAnswer.note)}</p></div></div><div class="result-actions"><button class="button primary" id="save-report">带走我的成分 ${arrow}</button><button class="button secondary" id="revise">我不服，重选 ↶</button></div><details class="rules"><summary>看看题目是怎么设定的</summary><div class="rules-content"><p>前 7 题参与计分，其中 3 题由搭子出。分数取选项值的平均数，角色类型还会参考具体选择。</p>${report.scoreParts.map(part=>`<div class="rule-row"><span>${esc(part.label)}</span><span>${part.value}</span></div>`).join('')}<p>最后 3 题留给生活。</p></div></details><p class="reveal-prompt">等等。这就能证明你有多少价值了？</p><button class="button reveal-button" id="reveal" ${state.revealed?'hidden':''}>不能。那还测个啥？ ${arrow}</button></div></div><section class="epilogue" id="epilogue" aria-labelledby="epilogue-title" ${state.revealed?'':'hidden'}><div class="epilogue-head"><span>彩蛋 / 检测仪失灵了</span><span>NO MORE SCORING</span></div><div class="epilogue-body"><div><span class="eyebrow">本所决定，撤回对你的打分。</span><h2 id="epilogue-title" tabindex="-1">含人量可以降低。<br>生活不用申请。</h2><p>刚才我们把“AI率”倒过来，<br>一本正经地又评判了你一次。</p><div class="life-permit">生活许可证 · 长期有效</div><p>合作可以慢慢试。<br>人不必靠“不可替代”才配活得开心。</p></div><div class="right"><p>${esc(narrativeFor(report))}</p><p style="margin-top:13px">你说，多出来的时间想留给：</p><strong class="life-choice">${esc(report.life)}。</strong><p>${esc(report.scene)}</p><p class="final-line">${esc(report.endingTitle)}</p><button class="button" id="save-permit">领一张生活许可证 ${arrow}</button></div></div></section><div class="completed-samples"><div class="types-heading"><h2>本所常见人类样本</h2><button class="text-button sample-toggle" id="sample-toggle" aria-expanded="false">展开 10 种样本 ↗</button></div>
    <div class="types-preview">${Object.values(CHARACTERS).map(c => `<article class="mini-type" style="--type-color:${c.color}">${characterSVG(c.kind, c.name)}<strong>${c.name}</strong><small>${c.short}</small></article>`).join('')}</div></div><div class="afterword"><button class="text-button" id="restart">换个姿势，再测一次 ↗</button></div></section>`;
  app.querySelector('#sample-toggle').addEventListener('click', event => {
    const open = app.querySelector('.types-preview').classList.toggle('expanded');
    event.currentTarget.setAttribute('aria-expanded', String(open));
    event.currentTarget.textContent = open ? '收起样本 ↶' : '展开 10 种样本 ↗';
  });
 document.querySelector('#save-report').addEventListener('click',()=>saveCard(report,false));
 document.querySelector('#save-permit').addEventListener('click',()=>saveCard(report,true));
 document.querySelector('#revise').addEventListener('click',()=>{state.screen='quiz';state.index=QUESTION_COUNT-1;persist();render();focusTitle();});
 document.querySelector('#restart').addEventListener('click',()=>{state=blank(state.buddy);questions=[];persist();render();focusTitle();});
 document.querySelector('#reveal').addEventListener('click',()=>{state.revealed=true;persist();document.querySelector('#epilogue').hidden=false;document.querySelector('#reveal').hidden=true;document.querySelector('#epilogue-title').focus({preventScroll:true});document.querySelector('#epilogue').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});});
}
function symptom(code){return {'MANUAL UNIVERSE':'遇到重复劳动，第一反应是“我再努努力”。AI在旁边待机，你已经热到风扇起飞。','HUMAN BY CHOICE':'知道有捷径，仍然想亲自走走。不是舍不得用工具，是这段路本来就挺好玩。','TIME RECLAIMER':'该委托的委托，该验收的验收。至于省下来的时间——你有自己的安排。','FLEXIBLE PARTNER':'一边试着自己做，一边和AI来回改。分工合同每天更新，具体谁主导，看情况。','AUTO-PILOT':'材料已读，来源未读。漂亮的引用列表里，可能住着几篇平行宇宙论文。','MODEL ROUTER':'鲸鱼写，螃蟹审，白龙总结。三家AI争论了半小时，人类负责复制粘贴。','ONE MORE':'最终版第十八次修订。你突然发现，第一版其实就挺好。','DDL GHOST':'白天离线，23:55突然召唤全部硅基同事。','PROMPT WIZARD':'任务只有两行，咒语写了三屏。你对提示词的敬畏，AI都看在眼里。','PROMPT ARCHIVE':'收藏夹的生产力已经爆表，今天真正用过的只有搜索框。'}[code];}

async function saveCard(report,permit){
 const buttons=[...app.querySelectorAll('#save-report,#save-permit')];buttons.forEach(b=>b.disabled=true);
 try{const blob=await renderPoster(report,CHARACTERS[report.profile.code],state.reportId,permit,state.buddy);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(permit?'生活许可证':'我的含人量')+'-'+(state.reportId||'本机')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('成分已装裱，去下载列表领图。');}
 catch{toast('这次装裱失败了，先截图带走也行。');}finally{buttons.forEach(b=>b.disabled=false);}
}

function render() {
  clearTimeout(scanTimer);
  document.querySelector('#squad-button').hidden = state.screen !== 'home';
  if (state.screen === 'quiz') quiz();
  else if (state.screen === 'report') reportPage();
  else home();
}
const dialog=document.querySelector('#about-dialog');
document.querySelector('.brand').addEventListener('click',event=>{event.preventDefault();state.screen='home';persist();render();focusTitle();});
document.querySelector('#about-button').addEventListener('click',()=>dialog.showModal());
document.querySelector('#close-dialog').addEventListener('click',()=>dialog.close());
document.querySelector('#understood').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
render();

document.querySelector('#squad-button').addEventListener('click', () => {
  app.querySelector('[aria-pressed="true"]').focus({preventScroll: true});
  app.querySelector('.buddy-picks').scrollIntoView({block: 'center'});
});

</script>
</body>
</html>
