.question-action { justify-content: flex-end; }

.buddy-report > div:first-child { width: 72px; height: 72px; flex-shrink: 0; }

.types-preview.expanded .mini-type { display: block; }

const QUESTION_COUNT = 10;
const FORM_VERSION = 2;
const REPORT_TYPES = ['MANUAL UNIVERSE', 'HUMAN BY CHOICE', 'TIME RECLAIMER',
  'FLEXIBLE PARTNER', 'AUTO-PILOT', 'ONE MORE'];
const dimensionIds = Object.keys(DIMENSIONS);
const allItems = [...ANCHORS, ...Object.values(COMPANION_ITEMS).flatMap(groups => Object.values(groups).flat()),
  SUPPORT_ITEM, LIFE_ITEM];
const itemById = new Map(allItems.map(question => [question.id, question]));

function drawQuestions(buddyId, random = Math.random) {
  const groups = COMPANION_ITEMS[buddyId] ?? COMPANION_ITEMS.deepseek;
  const selected = dimensionIds.map(dimension => {
    const candidates = groups[dimension];
    const index = Math.min(candidates.length - 1, Math.floor(random() * candidates.length));
    return candidates[Math.max(0, index)];
  });
  return [selected[0], ANCHORS[1], selected[2], ANCHORS[3],
    ANCHORS[0], selected[1], ANCHORS[2], selected[3], SUPPORT_ITEM, LIFE_ITEM];
}

function restoreQuestions(ids, buddyId) {
  if (!COMPANION_ITEMS[buddyId] || !Array.isArray(ids) || ids.length !== QUESTION_COUNT ||
      new Set(ids).size !== QUESTION_COUNT) return null;
  const questions = ids.map(id => itemById.get(id));
  if (questions.some(question => !question)) return null;
  const expected = drawQuestions(buddyId, () => 0);
  const valid = questions.every((question, index) => {
    const slot = expected[index];
    if (slot.role !== 'companion') return question === slot;
    return COMPANION_ITEMS[buddyId][slot.dimension].includes(question);
  });
  return valid ? questions : null;
}

function isValidAnswers(answers, questions, complete = true) {
  if (!Array.isArray(questions) || questions.length !== QUESTION_COUNT ||
      !Array.isArray(answers) || answers.length !== QUESTION_COUNT) return false;
  return questions.every((question, index) => {
    const answer = answers[index];
    return answer === null ? !complete : Number.isInteger(answer) && answer >= 0 && answer < question.options.length;
  });
}

function dimensionResult(id, answers, questions) {
  const evidence = questions.flatMap((question, index) => {
    if (question.dimension !== id) return [];
    const option = question.options[answers[index]];
    return [{questionId: question.id, role: question.role, title: question.title,
      optionId: option.id, text: option.text, value: option.value}];
  });
  const available = evidence.filter(answer => answer.value !== null);
  const value = available.length ? available.reduce((sum, answer) => sum + answer.value, 0) / available.length : null;
  const complete = available.length === 2;
  const low = complete && available.every(answer => answer.value <= 1);
  const high = complete && available.every(answer => answer.value >= 2);
  let interpretation = '这两处的选择有差别，可以展开看看具体情境。';
  if (!available.length) interpretation = '这两题暂时说不准，本次先留空。';
  else if (!complete) interpretation = '目前只有一处明确选择，先看这一题的具体回答。';
  else if (low) interpretation = DIMENSIONS[id].low + '，两处情境的选择一致。';
  else if (high) interpretation = DIMENSIONS[id].high + '，两处情境的选择一致。';
  return {id, ...DIMENSIONS[id], evidence, available: available.length, value, low, high, interpretation};
}

function makeReport(answers, questions) {
  if (!isValidAnswers(answers, questions)) throw new TypeError('请完成全部场景题。');
  const dimensions = Object.fromEntries(dimensionIds.map(id => [id, dimensionResult(id, answers, questions)]));
  const {delegation, verification, learning, stopping} = dimensions;
  let code = 'FLEXIBLE PARTNER';
  let basis = dimensionIds;
  if (delegation.high && verification.low) {
    code = 'AUTO-PILOT'; basis = ['delegation', 'verification'];
  } else if (delegation.low && stopping.low) {
    code = 'MANUAL UNIVERSE'; basis = ['delegation', 'stopping'];
  } else if (learning.high) {
    code = 'HUMAN BY CHOICE'; basis = ['learning'];
  } else if (stopping.low) {
    code = 'ONE MORE'; basis = ['stopping'];
  } else if (delegation.high && stopping.high && verification.high) {
    code = 'TIME RECLAIMER'; basis = ['delegation', 'stopping', 'verification'];
  }
  const profiles = {
    'AUTO-PILOT': ['已阅但没看', '活交出去挺快，检查这步可以再留一点时间。',
      '两道整理任务你都愿意让搭子先上，两道核对题里你都选择了较少检查。下回可以抽一处原资料对照，试试能不能找出点差别。'],
    'MANUAL UNIVERSE': ['人肉CPU', '自己做的多，达标后还想接着改。',
      '两道重复任务里你都留了大半给自己，两道收工题里又选了继续。下一次不妨只交出一小段格式整理，看看腾出的半小时去哪儿了。'],
    'HUMAN BY CHOICE': ['手作犟种', '这回想学会，所以先自己动手。',
      '两道以练会方法为目标的题，你都选择先尝试，再求助或对照。至于整理格式、安排时间怎么做，下面另外两组回答也各有依据。'],
    'ONE MORE': ['再改一版仙人', '已经够交了，手还是想再点两下。',
      '两道题都说明当前版本已经检查合格，你仍然选了继续修改。这只是你对这两种情境的选择，今晚也可以试一次保存后就关机。'],
    'TIME RECLAIMER': ['甩手掌柜', '交给搭子，查过，再收工。',
      '在整理、查证和收工这三组里，你都给了相近的选择。搭子处理重复部分，你核对结果，达标后就去做自己的事。'],
    'FLEXIBLE PARTNER': ['混合搭班型', '你的分工要看具体任务。',
      '这次的选择没有集中到单一组合。可以看下面四组情境，哪些想自己来，哪些愿意交出去，每一条都回到你刚才选的答案。']
  };
  const availableCount = Object.values(dimensions).reduce((count, dimension) => count + dimension.available, 0);
  const incompleteOnly = code === 'FLEXIBLE PARTNER' && !Object.values(dimensions).some(dimension => dimension.available === 2);
  const [name, verdict, description] = incompleteOnly
    ? ['搭班待观察', '说不准的部分，先留着。', `八道分工题里，这次有 ${availableCount} 处明确选择，暂时还凑不成一组完整配对。下面保留了你的回答，遇到相应情境后可以再来试试。`]
    : profiles[code];
  const life = questions[9].options[answers[9]];
  const support = questions[8].options[answers[8]];
  const needsBreak = stopping.low;
  const scenes = {
    walk: needsBreak ? '电脑先合上，去操场坐会儿。今天可以只看看人来人往，不用再给散步定个目标。' : '从平时不走的门出去，买个烤红薯，逛到哪儿算哪儿。看看街边新开的小店，也看看今天的树。',
    people: needsBreak ? '约个熟人吃顿热饭，消息晚点回也行。让对方讲讲最近那件小事，这顿饭慢慢吃。' : '给想见的人发条消息，或者打通电话。从今天食堂吃了什么聊起，想聊久一点就聊久一点。',
    hobby: needsBreak ? '把那件小爱好拿出来，画两笔、拼两块都行。玩到一半也能收起来，今天不用完成作品。' : '放首喜欢的歌，翻几页闲书，或者去打两局游戏。你想做的事，现在有了一小段时间。',
    rest: needsBreak ? '把电脑合上，消息静音，给自己放半天假。睡醒了再吃点东西，剩下的任务明天再说。' : '冲个热水澡，换件软乎的衣服。往床上一倒，想睡就睡。'
  };
  const scoredEvidence = basis.flatMap(id => dimensions[id].evidence.filter(item => item.value !== null));
  const score = delegation.available === 2 ? Math.round((3 - delegation.value) / 3 * 100) : null;
  return {score, scoreText: score === null ? '—' : String(score), scoreLabel: '重复任务亲自处理倾向',
    profile: {code, name, verdict, description, tag: verdict}, dimensions,
    evidence: scoredEvidence, support: {id: support.id, text: support.text},
    life: life.life, future: 'campus', scene: scenes[life.id],
    endingTitle: needsBreak ? '今天给自己放个假。' : '这两个小时归你。',
    scoreParts: Object.values(dimensions).map(dimension => ({label: dimension.label, value: dimension.value})),
    version: FORM_VERSION};
}

function narrativeFor(report) {
  return report.dimensions.stopping.low
    ? '刚才两道已经达标的情境，你都选了继续改。这一回也可以给自己留个空档。'
    : '这十题做完，安排回到你手里。下面这件小事，是你刚才自己选的。';
}

function qualitySignals(questions, answers, timings) {
  const answered = questions.slice(0, 8).map((question, i) => ({question, answer: answers[i], ms: timings[i] ?? 0}))
    .filter(item => item.answer !== null);
  const rapid = answered.filter(item => item.ms < 1000).length;
  const flags = [];
  if (rapid >= 3) flags.push('several-quick-pages');
  if (rapid >= 3 && answered.some((item, i) => i >= 3 &&
      answered.slice(i - 3, i + 1).every(other => other.answer === item.answer))) flags.push('quick-repeated-position');
  const differing = dimensionIds.flatMap(id => {
    const pair = answered.filter(item => item.question.dimension === id);
    if (pair.length !== 2) return [];
    const values = pair.map(item => item.question.options[item.answer].value);
    return values.every(value => value !== null) && Math.abs(values[0] - values[1]) === 3
      ? [{dimension: id, questionIds: pair.map(item => item.question.id)}] : [];
  });
  if (differing.length >= 2) flags.push('several-context-differences');
  return {flags, differing, quickPages: rapid};
}

function submissionEndpoint(documentRoot = document) {
  const value = documentRoot.querySelector('meta[name="survey-endpoint"]')?.content;
  if (!value) return '';
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && url.pathname === '/api/responses' &&
      !url.username && !url.password && !url.search && !url.hash ? url.href : '';
  } catch {
    return '';
  }
}

function newResponseId() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

async function sendResponse(endpoint, payload, fetcher = fetch) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetcher(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    if (!response.ok) throw new Error('Submission failed');
    const receipt = await response.json();
    if (receipt.ok !== true || receipt.id !== payload.id) throw new Error('Invalid receipt');
    return receipt;
  } finally {
    clearTimeout(timer);
  }
}

function confirmReview() {
  const quality = qualitySignals(questions, state.answers, state.timings);
  if (state.qualityReviewed || quality.flags.length === 0) return Promise.resolve(true);
  const reminder = document.querySelector('#quality-dialog');
  const hasSpeedFlag = quality.flags.includes('several-quick-pages');
  reminder.innerHTML = `<div class="review-buddy">${buddyFigure(state.buddy)}</div>
    <h2>搭子探个头</h2>
    <p>${hasSpeedFlag ? '刚才有几题一下就翻过去啦。要不要回头瞅一眼？' : '有两组情境，你两次的选择差得挺多。是情境不同，还是想回头改一项？'}</p>

    <button class="text-button" id="review-choices">回头看看</button>`;
  return new Promise(resolve => {
    let resolved = false;
    const settle = goAhead => {
      if (resolved) return;
      resolved = true;
      state.qualityReviewed = true;
      state.qualityReason = goAhead ? (hasSpeedFlag ? 'confirmed' : 'context-difference') : 'reviewed';
      persist();
      reminder.close();
      if (!goAhead) {
        state.index = hasSpeedFlag ? 0 : questions.findIndex(q => q.id === quality.differing[0].questionIds[0]);
        persist();
        render();
        focusTitle();
      }
      resolve(goAhead);
    };
    reminder.querySelector('#confirm-choices').onclick = () => settle(true);
    reminder.querySelector('#review-choices').onclick = () => settle(false);
    reminder.oncancel = event => { event.preventDefault(); settle(false); };
    reminder.showModal();
  });
}

  state.responseId ??= newResponseId();
  persist();

    await sendResponse(endpoint, {
      id: state.responseId, version: FORM_VERSION, buddy: state.buddy,
      questionIds: state.questionIds, answers: state.answers,
      context: {population: state.population, aiUse: state.aiUse},
      quality: {timings: state.timings, revisions: state.revisions, reviewed: state.qualityReviewed, reason: state.qualityReason},
      isTest: new URL(location.href).searchParams.get('test') === '1'
    });
    state.submitted = true;

  } catch {
    submitButton.disabled = false;
    backButton.disabled = false;

    submitButton.textContent = '重新提交并看结果 ↗';

        <p class="home-lead">选个搭子，聊聊上课、复习、课设和你的课余时间。</p>
        <div class="hero-actions">
          <div class="buddy-picks" aria-label="选择出题搭子">
            ${Object.entries(AI_BUDDIES).map(([id, item]) => `<button class="buddy-pick ${state.buddy === id ? 'active' : ''}" data-buddy="${id}" aria-pressed="${state.buddy === id}" aria-label="${item.nick}">
              <span aria-hidden="true">${buddySVG(id)}</span><strong>${item.nick}</strong>
            </button>`).join('')}
          </div>
          <div class="context-card">
  <label>你的校园身份（可选）<select id="population">
    <option value="unspecified">暂不填写</option><option value="sdu-student">山东大学在读学生</option>
    <option value="other-student">其他高校在读学生</option><option value="other">已毕业或其他</option>
  </select></label>
  <label>平时用 AI 的频率（可选）<select id="ai-use">
    <option value="unspecified">暂不填写</option><option value="never">还没用过</option>
    <option value="monthly">每月偶尔用</option><option value="weekly">每周会用</option><option value="daily">几乎每天用</option>
  </select></label>
</div><button class="button primary start" id="start">让${buddy.nick}出题 ${arrow}</button>
          <p class="micro">每局 10 题 · 约 3 分钟</p>${endpoint ? `<p class="collection-note">完成后提交匿名答卷，供本次活动统计。</p>` : ''}
        </div>
      </div>
      <div class="stage" aria-label="当前出题搭子">
        <div class="stage-back" style="background-color:${buddy.color}"></div>
        <div class="squad-hero">${buddyFigure(state.buddy)}</div>
        <div class="bubble top">${buddy.line}</div>
      </div>
    </div>
  </section>`;
  app.querySelector('#population').value = state.population;
  app.querySelector('#ai-use').value = state.aiUse;
  app.querySelector('#population').onchange = event => { state.population = event.target.value; persist(); };
  app.querySelector('#ai-use').onchange = event => { state.aiUse = event.target.value; persist(); };
  app.querySelectorAll('[data-buddy]').forEach(button => button.addEventListener('click', () => {
    state = {...blank(button.dataset.buddy), population: state.population, aiUse: state.aiUse};
    questions = [];
    persist();
    home();
    app.querySelector(`[data-buddy="${state.buddy}"]`).focus({preventScroll: true});
  }));
  app.querySelector('#start').addEventListener('click', () => {
    state = {...blank(state.buddy), population: state.population, aiUse: state.aiUse};
    questions = drawQuestions(state.buddy);
    state.questionIds = questions.map(q => q.id);
    state.screen = 'quiz';
    persist();
    render();
    focusTitle();
  });
}

function quiz(){
  recordReadingTime();
  pageActiveSince = document.hidden ? null : performance.now();
  const q=questions[state.index];
  app.innerHTML=`<section class="question-layout fade-in"><div class="question-top"><button class="back" id="back"><span aria-hidden="true">←</span> ${state.index?'上一题':'返回首页'}</button><span class="progress-count"><strong>${String(state.index+1).padStart(2,'0')}</strong> / ${String(QUESTION_COUNT).padStart(2,'0')}</span></div><div class="progress" role="progressbar" aria-label="答题进度" aria-valuenow="${state.index+1}" aria-valuemin="0" aria-valuemax="${QUESTION_COUNT}"><span style="width:${(state.index+1)/QUESTION_COUNT*100}%"></span></div><div class="question-label"><span class="eyebrow">${String(state.index+1).padStart(2,'0')} / ${esc(q.tag)}</span>${q.tag.endsWith('出题') ? `<div class="question-mini" aria-hidden="true">${buddyFigure(state.buddy)}</div>` : ''}</div><h1>${esc(q.title)}</h1><p class="question-sub" id="question-sub" ${q.sub ? '' : 'hidden'}>${esc(q.sub)}</p><fieldset class="choices" aria-describedby="question-sub"><legend>${esc(q.title)}</legend>${q.options.map((o,i)=>`<label class="choice ${state.answers[state.index]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="choice-letter" aria-hidden="true">${'ABCDE'[i]}</span><span class="choice-text">${esc(o.text)}</span></label>`).join('')}</fieldset><div class="feedback" id="feedback" aria-live="polite">${state.answers[state.index]!==null?esc((q.options[state.answers[state.index]].note ?? '')):''}</div>${endpoint && state.index===QUESTION_COUNT-1 ? `<p class="collection-note">交卷将保存本次选择和结果，供活动作者统计。</p>` : ''}<div class="question-action"><button class="button primary" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===QUESTION_COUNT-1?(endpoint ? '提交并看结果' : '看看我是啥'):'下一题'} ${arrow}</button></div></section>`;
  app.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{
    const value=Number(input.value);
    if (state.answers[state.index] !== value) {
      if (state.answers[state.index] !== null) state.revisions[state.index]++;
      state.responseId=null; state.submitted=false;
    }
    state.answers[state.index]=value;state.reportId=null;state.revealed=false;persist();
    app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c.contains(input)));
    document.querySelector('#feedback').textContent=q.options[value].note ?? '';document.querySelector('#next').disabled=false;
  }));
  document.querySelector('#back').addEventListener('click',()=>{recordReadingTime();if(state.index)state.index--;else state.screen='home';persist();render();focusTitle();});
  document.querySelector('#next').addEventListener('click',async()=>{
    if(state.answers[state.index]===null)return;
    recordReadingTime();
    if(state.index<QUESTION_COUNT-1){state.index++;persist();render();focusTitle();}else if(isValidAnswers(state.answers, questions)) {
      const button = app.querySelector('#next');
      button.disabled = true;
      const confirmed = await confirmReview();
      if (button.isConnected) button.disabled = false;
      if (confirmed) submitAndShowReport();
    }
  });
}

function startScan(){
  clearTimeout(scanTimer);app.innerHTML=`<section class="scan fade-in">${buddyFigure(state.buddy,'scan-buddy')}<h1>搭子在写报告</h1><div class="scan-line" role="status" aria-live="polite">翻一下答题记录……</div></section>`;window.scrollTo({top:0,behavior:'instant'});
  const lines=['有一题想再确认一下……','图片画好了。'];let i=0;
  const step=()=>{if(i<lines.length){app.querySelector('.scan-line').textContent=lines[i++];scanTimer=setTimeout(step,650);}else{state.screen='report';state.reportId=crypto.randomUUID?crypto.randomUUID().slice(0,8).toUpperCase():Date.now().toString(36).toUpperCase();persist();render();focusTitle();}};
  scanTimer=setTimeout(step,500);
}

function reportPage() {
  const report = makeReport(state.answers, questions);
  const profile = report.profile;
  const character = {...CHARACTERS[profile.code], name: profile.name, quote: profile.tag,
    ...(profile.code === 'FLEXIBLE PARTNER' ? {short: 'MIX', tags: ['看事分工', '各有安排', '慢慢试试']} : {})};
  const buddyAnswer = questions[0].options[state.answers[0]];
  app.innerHTML = `<section class="result-layout fade-in">
    <div class="result-intro"><h1>这次，你怎么和搭子配合？</h1><span class="pill">校园搭班记录</span></div>
    <div class="result-grid">
      <article class="ticket" aria-label="你的检测报告" style="--type-color:${character.color}">
        <div class="ticket-head"><span>你的搭班样本</span><span>HCL</span></div>
        <div class="type-poster"><div class="short-code">${character.short}</div>
          ${characterSVG(character.kind, character.name)}<h2>${character.name}</h2>
          <p class="type-quote">${esc(character.quote)}</p>
        </div>
        <div class="score-strip"><span>重复整理任务<br><small>亲自处理倾向</small></span><strong>${report.scoreText}<small> /100</small></strong></div>
        <div class="ticket-tail"><span>${AI_BUDDIES[state.buddy].nick}出题</span><span class="barcode" aria-hidden="true"></span></div>
      </article>
      <div class="result-copy">
        <h2>${esc(profile.verdict)}</h2><p class="result-description">${esc(profile.description)}</p>
        <div class="buddy-report">${buddyFigure(state.buddy)}<div><small>开场那一题</small>
          <strong>${AI_BUDDIES[state.buddy].nick}</strong><p>你选择了“${esc(buddyAnswer.text)}”</p></div></div>
        <div class="result-actions"><button class="button primary" id="save-report">带走这份记录 ${arrow}</button>
          <button class="button secondary" id="revise">回去改答案 ↶</button></div>
        <p class="support-choice">如果学校办活动，你最想要的帮助是<br><strong>${esc(report.support.text)}</strong></p>
        <p class="reveal-prompt">这些题聊完了，接下来想怎么过？</p>
        <button class="button reveal-button" id="reveal" ${state.revealed ? 'hidden' : ''}>把时间留给自己 ${arrow}</button>
      </div>
    </div>
    <section class="dimension-panel" aria-label="逐项回答依据">
      <h2>这份记录从哪里来</h2>
      ${Object.values(report.dimensions).map(dimension => `<details>
        <summary>${dimension.label}<small>${dimension.available}/2 处明确选择</small></summary>
        <p>${esc(dimension.interpretation)}</p>
        ${dimension.evidence.map(answer => `<p class="answer-evidence">${esc(answer.title)}<strong>${esc(answer.text)}</strong></p>`).join('')}
      </details>`).join('')}
    </section>
    <section class="epilogue" id="epilogue" aria-labelledby="epilogue-title" ${state.revealed ? '' : 'hidden'}>
      <div class="epilogue-head"><span>交卷以后</span><span>今天还有别的事</span></div>
      <div class="epilogue-body"><div><h2 id="epilogue-title" tabindex="-1">含人量可以降低。<br>生活不用申请。</h2>
        <p>刚才那些选择，只说得了这几件事。<br>你还可以有许多种生活。</p><div class="life-permit">生活许可证 · 长期有效</div>
        <p>即使有一天，很多工作都能由 AI 完成，<br>你依旧有享受生活、发现美的权利。</p></div>
        <div class="right"><p>${esc(narrativeFor(report))}</p><strong class="life-choice">${esc(report.life)}。</strong>
          <p>${esc(report.scene)}</p><p class="final-line">${esc(report.endingTitle)}</p>
          <button class="button" id="save-permit">带走这张生活许可证 ${arrow}</button></div>
      </div>
    </section>
    <div class="completed-samples"><div class="types-heading"><h2>其他搭班样本</h2>
      <button class="text-button" id="sample-toggle" aria-expanded="false">展开看看 ↗</button></div>
      <div class="types-preview">${REPORT_TYPES.map(code => ({...CHARACTERS[code], ...(code === 'FLEXIBLE PARTNER' ? {name: '混合搭班型', short: 'MIX'} : {})})).map(item => `<article class="mini-type" style="--type-color:${item.color}">
        ${characterSVG(item.kind, item.name)}<strong>${item.name}</strong><small>${item.short}</small></article>`).join('')}</div>
    </div>
    <div class="afterword"><button class="text-button" id="restart">换个搭子，再来一次 ↗</button></div>
  </section>`;
  app.querySelector('#sample-toggle').onclick = event => {
    const expanded = app.querySelector('.types-preview').classList.toggle('expanded');
    event.currentTarget.setAttribute('aria-expanded', String(expanded));
    event.currentTarget.textContent = expanded ? '收起来 ↶' : '展开看看 ↗';
  };
  app.querySelector('#save-report').onclick = () => saveCard(report, false);
  app.querySelector('#save-permit').onclick = () => saveCard(report, true);
  app.querySelector('#revise').onclick = () => { state.screen='quiz'; state.index=QUESTION_COUNT-1; persist(); render(); focusTitle(); };
  app.querySelector('#restart').onclick = () => { state={...blank(state.buddy), population: state.population, aiUse: state.aiUse}; questions=[]; persist(); render(); focusTitle(); };
  app.querySelector('#reveal').onclick = () => {
    state.revealed=true; persist(); app.querySelector('#epilogue').hidden=false; app.querySelector('#reveal').hidden=true;
    app.querySelector('#epilogue-title').focus({preventScroll:true});
    app.querySelector('#epilogue').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'});
  };
}

async function saveCard(report,permit){
 const buttons=[...app.querySelectorAll('#save-report,#save-permit')];buttons.forEach(b=>b.disabled=true);
 try{const blob=await renderPoster(report,{...CHARACTERS[report.profile.code],name:report.profile.name,quote:report.profile.tag,...(report.profile.code==='FLEXIBLE PARTNER'?{short:'MIX',tags:['看事分工','各有安排','慢慢试试']}:{})},state.reportId,permit,state.buddy);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(permit?'生活许可证':'我的含人量')+'-'+(state.reportId||'本机')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('成分已装裱，去下载列表领图。');}
 catch{toast('这次装裱失败了，先截图带走也行。');}finally{buttons.forEach(b=>b.disabled=false);}
}

function render() {
  if (submitting) return;
  clearTimeout(scanTimer);
  document.querySelector('#squad-button').hidden = state.screen !== 'home';
  if (state.screen === 'quiz') quiz();
  else if (state.screen === 'report') reportPage();
  else home();
}
const dialog=document.querySelector('#about-dialog');
document.querySelector('#collection-detail').hidden = !endpoint;
document.querySelector('.brand').addEventListener('click',event=>{event.preventDefault();if(submitting)return;recordReadingTime();state.screen='home';persist();render();focusTitle();});
document.querySelector('#about-button').addEventListener('click',()=>dialog.showModal());
document.querySelector('#close-dialog').addEventListener('click',()=>dialog.close());
document.querySelector('#understood').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
render();

document.querySelector('#squad-button').addEventListener('click', () => {
  app.querySelector('[aria-pressed="true"]').focus({preventScroll: true});
  app.querySelector('.buddy-picks').scrollIntoView({block: 'center'});
});

</script>
</body>
</html>
